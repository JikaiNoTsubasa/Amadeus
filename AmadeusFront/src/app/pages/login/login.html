<div class="login-container">
    <div class="login-card">
        <img src="amadeus_logo.png" alt="Amadeus Logo" class="login-logo"/>
        <div class="login-title">Amadeus</div>
        
        @if (!loginProgress) {
            <div class="splitter"></div>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <input type="email" placeholder="Email" class="login-input" name="email" formControlName="email"/>
                <input type="password" placeholder="Password" class="login-input" formControlName="password"/>
                <button type="submit" class="login-button">Login</button>
            </form>
        }
        @else {
            <app-loading-bar></app-loading-bar>
        }
    </div>
</div>
