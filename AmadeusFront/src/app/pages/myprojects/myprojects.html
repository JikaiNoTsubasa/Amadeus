<div>
    <app-toolbar title="My Projects" [showSearch]="true">
        <a class="toolbar-button-round" routerLink="/create-project" title="Create New Project">
            <i class="fa fa-plus"></i>
        </a>
        <div class="toolbar-button">
            <i class="fa fa-filter"></i> Filter
        </div>
    </app-toolbar>

    <div class="master-title">PROJECTS</div>
    
    <div class="grid">
        @for (project of myProjects; track $index) {
            <div class="grid-element">
                <app-project-card [project]="project">
                </app-project-card>
            </div>
        }
    </div>
</div>
