name: Deploy Amadeus Back to VPS

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup .NET 8
          uses: actions/setup-dotnet@v3
          with:
            dotnet-version: '8.0.x'

        - name: Restore dependencies
          run: dotnet restore
          working-directory: ./AmadeusBack

        - name: Publish
          run: dotnet publish -c Release -o ./publish
          working-directory: ./AmadeusBack

        - name: Clean remote directory via SSH
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            script: find /home/jikai/amadeus -mindepth 1 -type f ! -name 'appsettings.json' -exec rm -f {} +

        - name: Deploy
          uses: appleboy/scp-action@v1
          with:
            host: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            port: 22
            source: './AmadeusBack/publish/*'
            target: '/home/jikai/amadeus'
            strip_components: 2

        - name: Restart Amadeus service via SSH
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            script: sudo systemctl restart amadeus-api.service